name: New Release

#on: [push]
# on:
#   push:
#     tags:
#       - "release-*"
on: workflow_dispatch

jobs:
    new_release:
        name: Create release ${{ github.ref_name }}
        runs-on: [ubuntu-latest]
        steps:
            - name: Checkout
              # Checkout the repo
              uses: actions/checkout@v6
            - name: Preparation
              # Prepare some useful environment variables
              run: |
                  #
                  # Parse the tag name
                  #
                  # These variables must exist in the parent process so that
                  # the sourced code may alter them.
                  curr_release=
                  next_release=
                  # scripts/parse_release.sh ${{ github.ref_name }}
                  DEBUG=y scripts/parse_release.sh release-2.3.4
            - name: Configure
              if: false
              run: >
                  ./bootstrap &&
                  ./configure
            - name: Build
              id: find-bz-name
              run: |
                  #
                  # Build and run checks
                  #make distcheck
                  #
                  # Find out the bz2 name
                  bz2_name=
                  DEBUG=y scripts/find_out_bz2_name.sh
            - name: SHA1
              #
              # Calculate the checksum
              run: |
                  #sha1sum ${bz2_name} > ${bz2_name}.sha1
                  {
                    echo "sha1sum ${bz2_name} > ${bz2_name}.sha1"
                    echo bz2_name=${{ steps.find-bz-name.outputs.bz2_name }}
                  } >>  "$GITHUB_STEP_SUMMARY"
            - name: List files in the repository root
              run: |
                  {
                  echo "\`\`\`bash"
                  #ls -la ${{ github.workspace }}
                  #echo
                  #ls libupnp-*.tar.bz2
                  #echo
                  ls -la
                  echo "\`\`\`"
                  }  >> "$GITHUB_STEP_SUMMARY"
            - name: Release
              #
              # This action uploads the generated release files to GitHub
              if: false
              uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  generate_release_notes: true
                  files: |
                      ${{ steps.find-bz-name.outputs.bz2_name }}
                      ${{ steps.find-bz-name.outputs.bz2_name }}.sha1
            - name: Home_keeping
              if: false
              run: |
                  #
                  # Edit some files
                  source scripts/home_keeping.sh
                  #
                  # Configure git
                  git config --global user.name 'GitHub Action'
                  git config --global user.email 'github_action@users.noreply.github.com'
                  # Commit
                  git status >> $GITHUB_STEP_SUMMARY
                  git add -A
                  git commit -am "Home keeping for the next release"
                  git status >> $GITHUB_STEP_SUMMARY
                  git push origin HEAD:branch-1.14.x
